<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>WOVI — World of Visual Inspiration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/viewer.css">
    <link rel="stylesheet" href="/settings.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="logo" href="/" aria-label="WOVI — World of Visual Inspiration, home">
          <span class="logo-mark" aria-hidden="true"><span class="logo-scope">🔭</span>WOVI</span>
          <span class="logo-divider" aria-hidden="true"></span>
          <span class="logo-tagline" aria-hidden="true">World of<br>Visual Inspiration</span>
        </a>

        <nav class="main-nav" aria-label="Main">
          <a class="ghost" href="/" aria-current="page">Explore</a>
          <button class="ghost" type="button" disabled>Collections</button>
          <button class="ghost" type="button" id="saved-open" disabled>
            Saved <span class="nav-count" id="saved-count">0</span>
          </button>
          <button class="ghost" type="button" id="adaptors-open">Sources</button>
        </nav>
      </div>
    </header>

    <div class="page">
      <form class="search" role="search" id="search-form">
        <label class="sbox">
          <span class="visually-hidden">Search images</span>
          <svg class="sbox-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input
            class="search-input"
            id="search-input"
            type="search"
            name="q"
            placeholder="Search open libraries — prints, maps, specimens, stars…"
            autocomplete="off"
            spellcheck="false"
          >
          <kbd class="kbd" id="search-shortcut" aria-hidden="true">⌘K</kbd>
        </label>
        <button class="search-submit" type="submit">Search</button>
      </form>

      <fieldset class="sources">
        <legend>
          <div class="sources-head">
            <button class="disc" type="button" id="sources-disc" aria-expanded="false" aria-controls="src-panel">
              <span class="disc-caret" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
              </span>
              <span class="disc-label">Sources</span>
              <span class="sources-count" id="sources-count">0 of 0 on</span>
            </button>
            <span class="sources-summary" id="sources-summary">No sources selected</span>
            <div class="sources-tools">
              <button class="switch" type="button" id="sources-licence-switch" role="switch" aria-checked="false">
                <span class="track" aria-hidden="true"><span class="knob"></span></span>
                <span>Open licences only</span>
              </button>
              <span class="sources-divider" aria-hidden="true"></span>
              <button class="ghost" type="button" id="sources-all">All</button>
              <button class="ghost" type="button" id="sources-none">None</button>
            </div>
          </div>
        </legend>
        <div class="sources-body" id="src-panel" hidden></div>
      </fieldset>

      <ul class="error-list" id="error-list" aria-live="polite"></ul>

      <main class="site-main">
        <header class="results-header">
          <h1 class="results-title visually-hidden" id="results-title">WOVI — World of Visual Inspiration</h1>
          <p class="results-sub" id="results-sub" hidden></p>
          <div class="source-bar" id="source-bar" role="img" aria-label="Results by source" hidden></div>
          <ul class="source-legend" id="source-legend" hidden></ul>
        </header>

        <p class="status-line" id="status-line" aria-live="polite"></p>

        <section class="no-results" id="no-results" hidden>
          <p class="no-results-text" id="no-results-text"></p>
          <button class="ghost" type="button" id="no-results-sources">Show sources</button>
        </section>

        <section class="empty-state" id="empty-state" aria-label="Example searches">
          <p class="empty-text">
            Search the collections above, or start with one of these.
          </p>
          <div class="examples" id="examples">
            <button class="example" type="button" data-query="moon">moon</button>
            <button class="example" type="button" data-query="botanical illustration">botanical illustration</button>
            <button class="example" type="button" data-query="map of Paris">map of Paris</button>
            <button class="example" type="button" data-query="Hokusai">Hokusai</button>
            <button class="example" type="button" data-query="Apollo">Apollo</button>
            <button class="example" type="button" data-query="portrait">portrait</button>
          </div>
        </section>

        <div class="results" id="results"></div>

        <div class="load-more-wrap">
          <button class="load-more" type="button" id="load-more" hidden>Load more</button>
        </div>

        <div class="sentinel" id="sentinel" aria-hidden="true"></div>
      </main>
    </div>

    <div class="selection-bar" id="selection-bar" hidden>
      <p class="selection-count" id="selection-count" aria-live="polite"></p>
      <div class="selection-actions">
        <button class="button-primary" type="button" id="download-selected">
          Download selected
        </button>
        <button class="text-button" type="button" id="selection-clear">Clear</button>
      </div>
    </div>

    <dialog id="adaptors-dialog" aria-labelledby="adaptors-title"></dialog>
  </body>
</html>
